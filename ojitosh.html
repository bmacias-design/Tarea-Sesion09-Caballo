<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ojitos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #f4ece1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    .label {
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 3px;
      color: rgba(17, 17, 17, 0.4);
    }
  </style>
</head>
<body>

  <canvas id="characterCanvas" width="400" height="400"></canvas>
  <div class="label">ojitos</div>

  <script>
    const canvas = document.getElementById('characterCanvas');
    const ctx = canvas.getContext('2d');

    const width = canvas.width;
    const height = canvas.height;
    const center = { x: width / 2, y: height / 2 };

    const mouse = { x: center.x, y: center.y, targetX: center.x, targetY: center.y };

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.targetX = e.clientX - rect.left;
      mouse.targetY = e.clientY - rect.top;
    });

    // Parpadeo automático
    let isBlinking = false;
    let blinkProgress = 0;

    function triggerBlink() {
      if (!isBlinking) {
        isBlinking = true;
        blinkProgress = 0;
      }
    }

    setInterval(() => {
      if (Math.random() > 0.3) triggerBlink();
    }, 3500);

    let time = 0;

    function draw() {
      ctx.clearRect(0, 0, width, height);
      time += 0.03;

      // Inercia LERP suave
      mouse.x += (mouse.targetX - mouse.x) * 0.08;
      mouse.y += (mouse.targetY - mouse.y) * 0.08;

      // Vectores de dirección normalizados (-1 a 1)
      const dirX = (mouse.x - center.x) / (width / 2);
      const dirY = (mouse.y - center.y) / (height / 2);

      // Desplazamiento e inclinación del personaje
      const bodyX = center.x + dirX * 22;
      const bodyY = center.y + dirY * 16;
      const tiltAngle = dirX * 0.08;

      // Micro-respiración orgánica
      const breath = Math.sin(time * 2) * 2.5;

      ctx.save();
      ctx.translate(bodyX, bodyY);
      ctx.rotate(tiltAngle);

      // 1. Silueta de cápsula limpia
      const bodyWidth = 120;
      const bodyHeight = 140 + breath;
      const cornerRadius = 60;

      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.roundRect(-bodyWidth / 2, -bodyHeight / 2, bodyWidth, bodyHeight, cornerRadius);
      ctx.fill();

      // 2. Control de parpadeo
      let eyeScaleY = 1;
      if (isBlinking) {
        blinkProgress += 0.18;
        eyeScaleY = Math.abs(Math.cos(blinkProgress * Math.PI));
        if (blinkProgress >= 1) {
          isBlinking = false;
          eyeScaleY = 1;
        }
      }

      // 3. Ojos y seguimiento de pupilas
      const eyeSpacing = 26;
      const eyeY = -10 + dirY * 10;

      drawEye(-eyeSpacing + dirX * 12, eyeY, dirX, dirY, eyeScaleY);
      drawEye(eyeSpacing + dirX * 12, eyeY, dirX, dirY, eyeScaleY);

      ctx.restore();

      requestAnimationFrame(draw);
    }

    function drawEye(x, y, dirX, dirY, scaleY) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, scaleY);

      // Globo ocular
      const eyeRadius = 18;
      ctx.fillStyle = '#f4ece1';
      ctx.beginPath();
      ctx.arc(0, 0, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      // Pupila
      if (scaleY > 0.15) {
        const pupilMaxDist = 8;
        const pupilX = dirX * pupilMaxDist;
        const pupilY = dirY * pupilMaxDist;
        const pupilRadius = 8;

        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.arc(pupilX, pupilY, pupilRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    draw();
  </script>
</body>
</html>
