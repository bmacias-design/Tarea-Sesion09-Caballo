<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cabaio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d12;
      font-family: system-ui, sans-serif;
    }
    #webgl-container {
      width: 100%;
      height: 100%;
    }
    .info-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00f3ff;
      pointer-events: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="info-overlay">miau cabaio</div>
  <div id="webgl-container"></div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const container = document.querySelector('#webgl-container');
    const status = document.querySelector('.info-overlay');

    // 1. Escena, Cámara y Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d12);

    const baseCameraPos = new THREE.Vector3(0, 1.2, 3.6);
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.copy(baseCameraPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // 2. Iluminación de Estudio
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
    mainLight.position.set(5, 8, 5);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x00f3ff, 1.5);
    fillLight.position.set(-5, 2, -2);
    scene.add(fillLight);

    // 3. Piso con sombras
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 4. Captura de Cursor y Función de Mapeo (Map Range)
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    function mapRange(value, inMin, inMax, outMin, outMax) {
      return outMin + ((value - inMin) / (inMax - inMin)) * (outMax - outMin);
    }

    window.addEventListener('mousemove', (event) => {
      mouse.targetX = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('touchmove', (event) => {
      if (event.touches.length > 0) {
        mouse.targetX = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouse.targetY = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    });

    // 5. Carga del Modelo GLB
    let modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const loader = new GLTFLoader();
    const modelUrl = './public/modelos/personaje.glb';

    loader.load(
      modelUrl,
      (gltf) => {
        const model = gltf.scene;

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        // Escalado y centrado automático en el origen (pies en Y=0)
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 2.0;
        const scale = targetSize / maxDim;
        model.scale.setScalar(scale);

        model.position.x = -center.x * scale;
        model.position.y = -box.min.y * scale;
        model.position.z = -center.z * scale;

        modelGroup.add(model);
      },
      undefined,
      (error) => {
        console.error('Error al cargar el archivo .glb:', error);
        status.textContent = 'miau cabaio (ERROR AL CARGAR .GLB)';
      }
    );

    // 6. Bucle de Animación (Map a Rotación + Parallax)
    function animate() {
      requestAnimationFrame(animate);

      // Suavizado LERP
      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      if (modelGroup) {
        // MAP A ROTACIÓN ("Que te mira")
        const targetRotY = mapRange(mouse.x, -1, 1, -Math.PI * 0.25, Math.PI * 0.25);
        const targetRotX = mapRange(mouse.y, -1, 1, Math.PI * 0.1, -Math.PI * 0.1);

        modelGroup.rotation.y = targetRotY;
        modelGroup.rotation.x = targetRotX;

        // PARALLAX (Desplazamiento de objeto y cámara)
        modelGroup.position.x = mapRange(mouse.x, -1, 1, -0.2, 0.2);
        modelGroup.position.y = mapRange(mouse.y, -1, 1, -0.1, 0.1);

        camera.position.x = baseCameraPos.x + mouse.x * 0.3;
        camera.position.y = baseCameraPos.y + mouse.y * 0.2;
        camera.lookAt(modelGroup.position.x, 0.8, modelGroup.position.z);
      }

      renderer.render(scene, camera);
    }

    animate();

    // 7. Evento Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
